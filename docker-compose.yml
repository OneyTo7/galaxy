services:
  backend:
    build: ./backend
    container_name: galaxy-backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: galaxy-worker
    command: python -m app.worker
    env_file: ./backend/.env
    restart: unless-stopped
    depends_on:
      - backend

